---
layout: page
---
<h1>{{ page.title }}</h1>
{% if site.tags.size > 0 %}
{% for tag in site.tags %}
<section>
  <h2 id="{{ tag[0] | slugify }}">{{ tag[0] }}</h2>
  <ul class="post-list">
    {% for post in tag[1] %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a> <span class="metadata">{{ post.date | date: "%B %-d, %Y" }}</span></li>
    {% endfor %}
  </ul>
</section>
{% endfor %}
{% else %}
<p>No tags yet.</p>
{% endif %}
