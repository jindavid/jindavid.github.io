# Site Settings
baseurl: ""

# Features Setting
# Turn subpages on or off
publications: True
presentations: False
blog: True

# Language of the website
lang: en

# Search engine optimization settings
title: David Jin
description: David Jin. Ph.D. student at MIT working on GPU computing, numerical optimization, and efficient machine learning.
author: David Jin
twitter:
  username: davijin
  card: summary
social:
  name: David Jin
  links:
    - https://twitter.com/DaviJin
    - https://github.com/jindavid
locale: en_GB

# Page Settings
theme_settings:
  title: David Jin

  experience_title: EXPERIENCE
  interests_title: RESEARCH INTERESTS
  skills_title: SKILLS
  awards_title: AWARDS
  projects_title: PROJECTS
  recentpubs_title: RECENT PUBLICATIONS

# Pagination
paginate: 5
paginate_path: "blog/page:num"

# Build Settings
exclude:
  - README.md
  - BLOG_POST_GUIDE.md
  - LICENSE.txt
  - grape-theme.gemspec
  - dist
  - vendor
  - .openai
  - .github
  - assets/css/main.scss
  - _posts/2019-06-08-markdown-and-html.md
  - _posts/2019-06-09-grape-theme-style.md
  - presentations.md
  - example-hub.md
sass:
  sass_dir: _sass
  style: :compressed
plugins: ['jekyll-paginate', 'jekyll/scholar', 'jekyll-seo-tag']
bootstrap:
  assets: true

# Bibliography settings
scholar:
  bibliography: publications.bib
  bibliography_template: pubstemplate
  style: apa
  locale: en
  last_name: Jin
  first_name: [David, D.]
  sort_by: year,month
  order: descending,ascending

filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, status, author_marks, presentation_label, research_area] # Fields used only for website presentation

academicons:
  version: "1.9.1"
  integrity: "sha256-i1+4qU2G2860dGGIOJscdC30s9beBXjFfzjWLjBRsBg="
fontawesome:
  version: "5.15.4"
  integrity: "sha256-mUZM63G8m73Mcidfrv5E+Y61y7a12O5mW4ezU3bxqW4="
jquery:
  version: "3.6.0"
  integrity: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
